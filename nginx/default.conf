# Unlike a standard Laravel app (and unlike `ultimate`), this app's front
# controller (index.php) lives at the project root, not in /public — a
# common CodeCanyon/shared-hosting adaptation. Asset URLs are generated by
# the app as "/public/..." (see my_asset()/static_asset() in
# app/Http/Helpers.php), which resolves correctly because root here is the
# project root, not /var/www/public.
#
# Because of that, the docroot contains app/, config/, vendor/, storage/,
# composer.json/.lock, .env, shop.sql, etc. This config default-denies
# everything except: static files under /public/, robots.txt, and the dynamic
# favicon endpoint,
# and PHP execution of /index.php. Nothing else on disk is ever served
# directly, and no other .php file is ever executed.
# SERVER_PORT PHP sees always reflects this nginx's own listener (80,
# plain HTTP) -- fine in local dev (no reverse proxy in front), but wrong
# in production, where Cloudflare/ingress-nginx terminate the real public
# connection on 443 and forward to this pod over plain HTTP. Once
# X-Forwarded-Proto is correctly trusted (see TrustProxies.php), Laravel's
# URL generator combines "scheme=https" with "port=80" and explicitly
# appends ":80" to every generated URL, since 80 isn't the default port
# for https. Only override when a trusted proxy actually says https;
# local dev (no X-Forwarded-Proto header at all) keeps nginx's real port.
map $http_x_forwarded_proto $server_port_fixed {
    https 443;
    default $server_port;
}

server {
    listen 80 default_server;

    root /var/www;
    index index.php;

    charset utf-8;
    server_tokens off;
    client_max_body_size 128M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        text/xml
        image/svg+xml;

    # Theme assets, addon assets, downloadable files, user uploads.
    location ^~ /public/ {
        location ~ \.php$ {
            deny all;
        }
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # k8s liveness/readiness probes hit this instead of "/" -- "/" runs the
    # full Laravel bootstrap (DB queries, view render) on every probe, which
    # at a 10-20s interval across N pods adds up to real, constant, useless
    # load for a check that only needs to confirm nginx+php-fpm are up.
    location = /healthz {
        access_log off;
        log_not_found off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # Every other request — including ones that happen to match a real file
    # on disk (composer.json, .env, shop.sql, app/, vendor/, storage/, ...)
    # — is proxied to Octane, never served as-is. Octane only executes the
    # Laravel application (it cannot serve files), so anything that is not a
    # registered route returns 404. Octane keeps the app booted in memory
    # across requests, so per-request bootstrap overhead disappears.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header SERVER_PORT $server_port_fixed;
        proxy_hide_header X-Powered-By;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
        proxy_read_timeout 300;
    }
}
