# Unlike a standard Laravel app (and unlike `ultimate`), this app's front
# controller (index.php) lives at the project root, not in /public — a
# common CodeCanyon/shared-hosting adaptation. Asset URLs are generated by
# the app as "/public/..." (see my_asset()/static_asset() in
# app/Http/Helpers.php), which resolves correctly because root here is the
# project root, not /var/www/public.
#
# Because of that, the docroot contains app/, config/, vendor/, storage/,
# composer.json/.lock, .env, shop.sql, etc. This config default-denies
# everything except: static files under /public/, favicon.ico, robots.txt,
# and PHP execution of /index.php. Nothing else on disk is ever served
# directly, and no other .php file is ever executed.
server {
    listen 80 default_server;

    root /var/www;
    index index.php;

    charset utf-8;
    server_tokens off;
    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        text/xml
        image/svg+xml;

    # Theme assets, addon assets, downloadable files, user uploads.
    location ^~ /public/ {
        location ~ \.php$ {
            deny all;
        }
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # The one and only PHP file ever executed.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # Every other request — including ones that happen to match a real file
    # on disk (composer.json, .env, shop.sql, app/, vendor/, storage/, ...)
    # — is routed through the Laravel front controller, never served as-is.
    #
    # This is a plain rewrite, not try_files, on purpose: try_files only
    # treats a "path?query" target as an unconditional forward (with query
    # string) when it's the LAST argument. Since we never want a file
    # existence check here at all (that's the whole point — no $uri
    # fallback to real files), a bare rewrite is both correct and simpler.
    location / {
        rewrite ^ /index.php last;
    }
}
