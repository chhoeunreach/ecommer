services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: active_commerce_app
    env_file:
      - .env
    volumes:
      # Share application source with local Laravel while keeping Docker's
      # Linux vendor/runtime binaries (especially RoadRunner) intact.
      - ./app:/var/www/app
      # Mount the bootstrap entrypoint without replacing Docker's generated
      # cache files (the host cache may contain development-only providers).
      - ./bootstrap/app.php:/var/www/bootstrap/app.php
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./public:/var/www/public
      - ./resources:/var/www/resources
      - ./routes:/var/www/routes
      - ./.env:/var/www/.env
      - ./shop.sql:/var/www/shop.sql:ro
    command: >-
      sh -c 'rm -f bootstrap/cache/config.php bootstrap/cache/packages.php
      bootstrap/cache/services.php && exec /usr/local/bin/start.sh'
    ports:
      - "8083:80"
    environment:
      APP_URL: http://localhost:8083
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: active_commerce
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PASSWORD: ${DOCKER_REDIS_PASSWORD:-active_commerce_redis_local}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: active_commerce_queue
    env_file:
      - .env
    volumes:
      - ./app:/var/www/app
      - ./bootstrap/app.php:/var/www/bootstrap/app.php
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./public:/var/www/public
      - ./resources:/var/www/resources
      - ./routes:/var/www/routes
      - ./.env:/var/www/.env
    command: >-
      sh -c 'rm -f bootstrap/cache/config.php bootstrap/cache/packages.php
      bootstrap/cache/services.php && exec php artisan queue:work redis
      --queue=default --sleep=3 --tries=3 --timeout=900'
    environment:
      APP_URL: http://localhost:8083
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: active_commerce
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PASSWORD: ${DOCKER_REDIS_PASSWORD:-active_commerce_redis_local}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: active_commerce_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: active_commerce
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: active_commerce_redis
    command: redis-server --requirepass ${DOCKER_REDIS_PASSWORD:-active_commerce_redis_local} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DOCKER_REDIS_PASSWORD:-active_commerce_redis_local}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
